<!doctype html>
<!--
  Careers page: a short interest quiz, a filterable set of career cards and a list of sources.
  This file is only the page frame. js/pages/careers.js fills each empty "slot" below
  with content from data/careers.json, so edit the JSON to change the words.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Careers</title>
  <meta name="description" content="Find career paths in the quantum industry, from technicians to software developers, plus a short interest quiz.">
  <meta name="theme-color" content="#0b1626">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/careers.css">
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/careers.js"></script>
</head>
<body data-page="careers" data-page-title="Careers">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="page-header surface-dark">
      <div class="container">
        <p class="eyebrow">Careers</p>
        <h1>Quantum careers (many don't need a PhD)</h1>
        <p class="lead">Technicians, software developers, security experts, electricians and project managers all help build the quantum industry. Take a one-minute quiz to see which path might fit you, then explore the jobs.</p>
      </div>
    </section>

    <section class="section careers-intro" id="why" aria-busy="true">
      <div class="container" data-slot="intro">
        <div class="skeleton careers-skeleton careers-skeleton--title"></div>
        <div class="skeleton careers-skeleton"></div>
        <div class="skeleton careers-skeleton careers-skeleton--block"></div>
      </div>
    </section>

    <section class="section section--alt careers-quiz-section" id="quiz" aria-busy="true">
      <div class="container" data-slot="quiz">
        <div class="skeleton careers-skeleton careers-skeleton--title"></div>
        <div class="skeleton careers-skeleton careers-skeleton--block"></div>
      </div>
    </section>

    <section class="section careers-results-section" id="results" hidden>
      <div class="container" data-slot="results"></div>
    </section>

    <section class="section section--alt careers-explore-section" id="explore" aria-busy="true">
      <div class="container" data-slot="explore">
        <div class="skeleton careers-skeleton careers-skeleton--title"></div>
        <div class="skeleton careers-skeleton careers-skeleton--block"></div>
      </div>
    </section>

    <section class="section careers-sources-section" data-slot="sources"></section>

    <section class="section surface-dark careers-cta" data-slot="cta"></section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <noscript><div class="container section"><p class="notice notice--error">This site needs JavaScript to work. Please turn it on in your browser settings.</p></div></noscript>
</body>
</html>
