<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 640 340" width="640" height="340" fill="none">
  <!--
    Hero artwork for the home page (decorative, so the page marks it with an empty alt).
    Left: a steel mill glowing forge orange. Right: a qubit lattice glowing quantum cyan.
    In the middle, steel beams break apart into dots and turn from orange to cyan.
    The glow gently pulses unless the visitor asked their device for less motion.
  -->
  <defs>
    <radialGradient id="forge-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quantum-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ground-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#f97316"/>
      <stop offset="0.88" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08111f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#08111f" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse-slow { animation: pulse 6.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .spin { animation: spin 26s linear infinite; transform-origin: 505px 205px; }
      @keyframes pulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse-slow, .spin { animation: none; }
      }
    </style>
  </defs>

  <!-- Glows behind each side -->
  <ellipse class="pulse" cx="140" cy="250" rx="140" ry="130" fill="url(#forge-glow)"/>
  <ellipse class="pulse-slow" cx="505" cy="205" rx="135" ry="135" fill="url(#quantum-glow)"/>

  <!-- Tiny stars in the quantum sky -->
  <g fill="#cffafe" opacity="0.7">
    <circle cx="560" cy="48" r="1.6"/><circle cx="430" cy="70" r="1.2"/><circle cx="610" cy="120" r="1.4"/>
    <circle cx="350" cy="36" r="1.2"/><circle cx="470" cy="28" r="1.5"/><circle cx="600" cy="300" r="1.2"/>
  </g>

  <!-- ===== LEFT: the steel mill ===== -->
  <!-- Blast furnace tower -->
  <path d="M62 360 L78 160 L132 160 L148 360 Z" fill="#1a3354"/>
  <path d="M78 160 L132 160 L136 190 L74 190 Z" fill="#11233c"/>
  <rect x="70" y="146" width="70" height="16" rx="3" fill="#264a78"/>
  <path d="M84 146 Q105 100 126 146 Z" fill="#f97316" filter="url(#soft)" class="pulse"/>
  <path d="M92 146 Q105 118 118 146 Z" fill="#fdba74"/>
  <g stroke="#0b1626" stroke-width="3" opacity="0.55">
    <path d="M70 230 H140"/><path d="M66 290 H144"/>
  </g>
  <!-- Tall smokestack -->
  <rect x="172" y="96" width="20" height="264" fill="#14284a"/>
  <rect x="170" y="90" width="24" height="10" rx="2" fill="#264a78"/>
  <rect x="172" y="132" width="20" height="8" fill="#f97316" opacity="0.8"/>
  <rect x="172" y="152" width="20" height="8" fill="#f97316" opacity="0.5"/>
  <!-- Mill hall with a sawtooth roof -->
  <path d="M206 360 V250 L206 222 L238 250 V222 L270 250 V222 L302 250 V360 Z" fill="#11233c"/>
  <g fill="#fb923c">
    <rect x="216" y="284" width="14" height="20" rx="2"/><rect x="242" y="284" width="14" height="20" rx="2" opacity="0.75"/>
    <rect x="268" y="284" width="14" height="20" rx="2"/><rect x="216" y="318" width="14" height="20" rx="2" opacity="0.6"/>
    <rect x="268" y="318" width="14" height="20" rx="2" opacity="0.85"/>
  </g>
  <!-- Overhead crane and a hanging beam -->
  <path d="M20 118 H214" stroke="#334a6b" stroke-width="5"/>
  <path d="M20 112 V124 M214 112 V124" stroke="#334a6b" stroke-width="5"/>
  <path d="M40 118 V160" stroke="#334a6b" stroke-width="2"/>
  <g fill="#fb923c">
    <rect x="22" y="160" width="40" height="5"/><rect x="22" y="178" width="40" height="5"/>
    <rect x="38" y="165" width="8" height="13"/>
  </g>

  <!-- ===== MIDDLE: beams break apart and turn into qubits ===== -->
  <g>
    <rect x="318" y="326" width="50" height="9" rx="2" fill="#fb923c"/>
    <rect x="334" y="335" width="18" height="16" fill="#fb923c"/>
    <rect x="318" y="351" width="50" height="9" rx="2" fill="#fb923c"/>
    <rect x="342" y="276" width="34" height="7" rx="2" fill="#f9a65a" transform="rotate(-10 359 280)"/>
    <rect x="352" y="283" width="12" height="11" fill="#f9a65a" transform="rotate(-10 359 280)"/>
    <rect x="342" y="294" width="34" height="7" rx="2" fill="#f9a65a" transform="rotate(-10 359 280)"/>
    <rect x="372" y="232" width="22" height="6" rx="2" fill="#c9c58a" transform="rotate(-24 383 235)"/>
    <rect x="378" y="238" width="8" height="8" fill="#c9c58a" transform="rotate(-24 383 235)"/>
    <rect x="372" y="246" width="22" height="6" rx="2" fill="#c9c58a" transform="rotate(-24 383 235)"/>
    <rect x="394" y="192" width="14" height="14" rx="3" fill="#8bd9d0" transform="rotate(-38 401 199)"/>
    <circle cx="418" cy="158" r="8" fill="#67e8f9"/>
    <circle cx="436" cy="126" r="5" fill="#67e8f9"/>
  </g>
  <path d="M310 340 C 360 330, 380 250, 420 190 S 470 100, 500 100" stroke="url(#bridge)" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== RIGHT: the qubit lattice ===== -->
  <!-- Pylons that carry the lattice up from the ground -->
  <path d="M470 360 L492 262 M540 360 L518 262" stroke="#1a3354" stroke-width="8" stroke-linecap="round"/>
  <path d="M440 360 H570" stroke="#1a3354" stroke-width="6" stroke-linecap="round"/>

  <!-- Lattice links -->
  <g stroke="#22d3ee" stroke-width="2" opacity="0.55">
    <path d="M440 140 H570 M430 205 H580 M440 270 H570"/>
    <path d="M455 120 V290 M505 105 V305 M555 120 V290"/>
    <path d="M440 140 L430 205 L440 270 M570 140 L580 205 L570 270"/>
  </g>
  <!-- Lattice nodes (qubits) -->
  <g fill="#0b1626" stroke="#67e8f9" stroke-width="3">
    <circle cx="440" cy="140" r="9"/><circle cx="570" cy="140" r="9"/>
    <circle cx="430" cy="205" r="9"/><circle cx="580" cy="205" r="9"/>
    <circle cx="440" cy="270" r="9"/><circle cx="570" cy="270" r="9"/>
    <circle cx="455" cy="120" r="7"/><circle cx="555" cy="120" r="7"/>
    <circle cx="455" cy="290" r="7"/><circle cx="555" cy="290" r="7"/>
    <circle cx="505" cy="305" r="7"/><circle cx="505" cy="105" r="7"/>
  </g>
  <g fill="#67e8f9">
    <circle class="pulse" cx="440" cy="140" r="4"/><circle class="pulse-slow" cx="580" cy="205" r="4"/>
    <circle class="pulse-slow" cx="440" cy="270" r="4"/><circle class="pulse" cx="555" cy="290" r="3"/>
  </g>

  <!-- Central qubit with two orbits -->
  <g class="spin">
    <ellipse cx="505" cy="205" rx="92" ry="34" transform="rotate(-28 505 205)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <ellipse cx="505" cy="205" rx="92" ry="34" transform="rotate(28 505 205)" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="582" cy="177" r="6" fill="#ffffff"/>
    <circle cx="428" cy="233" r="6" fill="#22d3ee"/>
  </g>
  <circle cx="505" cy="205" r="30" fill="#22d3ee" opacity="0.28" filter="url(#soft)" class="pulse"/>
  <circle cx="505" cy="205" r="19" fill="#0b1626" stroke="#67e8f9" stroke-width="4"/>
  <circle cx="505" cy="205" r="8" fill="#ffffff"/>

  <!-- Ground: the same land, forge to quantum -->
  <rect x="0" y="360" width="640" height="20" fill="url(#ground-fade)"/>
  <rect x="0" y="358" width="640" height="4" fill="url(#ground-line)"/>
</svg>
